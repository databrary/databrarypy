name: CI

on:
  push:
    branches:
      - main
      - staging
      - development
      - feature/DAT-1480  # TEMPORARY - remove after testing
  pull_request:
    # Run on all pull requests

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run Ruff linting
        run: poetry run ruff check src/ tests/

      - name: Run Ruff formatting check
        run: poetry run ruff format --check src/ tests/

      - name: Run Black formatting check
        run: poetry run black --check src/ tests/

      - name: Run Mypy type checking
        run: poetry run mypy src/

      - name: Run tests with coverage
        run: poetry run pytest tests/unit/ -v --cov=databrarypy --cov-report=term-missing --cov-report=json --cov-fail-under=80

      - name: Check coverage threshold
        run: |
          COVERAGE=$(poetry run python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage is below 80% (${COVERAGE}%)"
            exit 1
          elif (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "⚠️  Warning: Coverage is below 90% (${COVERAGE}%)"
          else
            echo "✅ Coverage is above 90% (${COVERAGE}%)"
          fi
