[tool.poetry]
name = "databrarypy"
version = "0.1.0-dev.1"
description = "Python client library for the Databrary API"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "databrarypy", from = "src" }]
homepage = "https://databrary.org"
repository = "https://github.com/NYU-Databrary/databrarypy"

[tool.poetry.dependencies]
python = "^3.12"
httpx = ">=0.27"
pydantic = ">=2.7"
python-dotenv = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-cov = ">=5.0"
ruff = ">=0.5"
black = ">=24.8"
mypy = ">=1.11"
pre-commit = ">=3.5"
commitizen = ">=3.29"
pdoc = ">=14"
python-semantic-release = ">=9.0"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "D",      # pydocstyle
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # unused arguments in tests are fine
    "S101",   # assert statements are fine in tests
    "D",      # no docstrings required in tests
]

[tool.ruff.lint.isort]
known-first-party = ["databrarypy"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    'staging: marks tests as staging-only (deselect with -m "not staging")',
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "$version"
version_files = [
    "pyproject.toml:version",
    "src/databrarypy/__init__.py:__version__"
]
update_changelog_on_bump = true
major_version_zero = true
bump_pattern = "^(break|feat|fix|refactor)"
bump_map = {"break" = "MAJOR", "feat" = "MINOR", "fix" = "PATCH", "refactor" = "PATCH"}
commit_types = [
    {name = "feat", description = "A new feature"},
    {name = "fix", description = "A bug fix"},
    {name = "docs", description = "Documentation only changes"},
    {name = "style", description = "Changes that do not affect the meaning of the code"},
    {name = "refactor", description = "A code change that neither fixes a bug nor adds a feature"},
    {name = "perf", description = "A code change that improves performance"},
    {name = "test", description = "Adding missing tests or correcting existing tests"},
    {name = "build", description = "Changes that affect the build system or external dependencies"},
    {name = "ci", description = "Changes to our CI configuration files and scripts"},
    {name = "chore", description = "Other changes that don't modify src or test files"},
    {name = "revert", description = "Reverts a previous commit"},
    {name = "cleanup", description = "Code cleanup"}
]
commit_regex = "^(build|ci|docs|feat|fix|perf|refactor|style|test|chore|revert|bump|cleanup)(\\(\\S+\\))?!?: (.+)$"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["src/databrarypy/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "{version}"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge",
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.staging]
match = "staging"
prerelease = true
prerelease_token = "rc"

# TEMPORARY - remove after testing
[tool.semantic_release.branches.feature-test]
match = "feature/DAT-1480"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test", "revert", "cleanup"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
