[tool.poetry]
name = "databrarypy"
version = "0.0.1"
description = "Python client library for the Databrary API"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "databrarypy", from = "src" }]
homepage = "https://databrary.org"
repository = "https://github.com/NYU-Databrary/databrarypy"

[tool.poetry.dependencies]
python = "^3.12"
httpx = ">=0.27"
pydantic = ">=2.7"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-cov = ">=5.0"
ruff = ">=0.5"
black = ">=24.8"
mypy = ">=1.11"
pre-commit = ">=3.5"
commitizen = ">=3.29"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "D",      # pydocstyle
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # unused arguments in tests are fine
    "S101",   # assert statements are fine in tests
    "D",      # no docstrings required in tests
]

[tool.ruff.lint.isort]
known-first-party = ["databrarypy"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/databrarypy/__init__.py:__version__"
]
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
